{% extends "base.html" %}
{% block content %}
<h1>Community Forum</h1>
<a href="{{ url_for('forum_routes.new_post') }}">New Post</a>
<ul>
    {% for post in posts %}
    <li>
        <a href="{{ url_for('forum_routes.view_post', post_id=post.id) }}">{{ post.content[:50] }}...</a>
        <small>Posted on {{ post.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
    </li>
    {% endfor %}
</ul>
{% endblock %}
